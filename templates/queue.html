<!-- login.html -->

{%  extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment Records</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #f4f4f4;
    }

    .container {
        width: 80%;
        margin: 0 auto;
        padding: 20px;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ddd;
    }

    th {
        background-color: darkslategrey;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    .btn-details, .btn-export {
        padding: 8px 12px;
        margin-right: 5px;
        border: none;
        border-radius: 3px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    .btn-cancel {
        padding: 8px 12px;
        margin-right: 5px;
        border: none;
        border-radius: 3px;
        background-color: #881c1c;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-details:hover, .btn-export:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
<div class="container">
    <h2>Experiment Queue</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Picture state</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2024-03-28</td>
                <td>Prepared</td>
                <td>
                    <button class="btn-details">Continue</button>
                </td>
            </tr>
            <tr>
                <td>2024-03-29</td>
                <td>Prepared</td>
                <td>
                    <button class="btn-details">Continue</button>
                </td>
            </tr>
            <tr>
                <td>2024-03-29</td>
                <td>Processing...</td>
                <td>
                    <button class="btn-cancel">Cancel</button>
                </td>
            </tr>
            <td>2024-03-29</td>
            <td>Pending...</td>
            <td>
                <button class="btn-cancel">Cancel</button>
            </td>
        </tr>
        <td>2024-03-29</td>
        <td>Pending...</td>
        <td>
                    <button class="btn-cancel">Cancel</button>
                </td>
            </tr>
        </tbody>
    </table>
    <div>        
        <h2>Add new task to Queue</h2>
        <div>        
            <button class="btn-details">Choose file</button>
        </div>
        <h6></h6>
        <div>        
            <button class="btn-details">Use device camera</button>
        </div>
    </div>
</div>

</body>
</html>

{% endblock content %}
