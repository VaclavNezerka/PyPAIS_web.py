<!-- REMBG_manual -->
<!DOCTYPE html>


{% extends "base.html" %}
{% block content %}


<html>

    <head>
        <title>REMBG_manual</title>
        <link rel="stylesheet" href="/static/styles.css">
        <link rel="icon" type="image/vnd.icon" href="/static/favicon.ico">
    </head>

    <body>
        <div class="container">
            <!-- First Row: Image Upload -->
            <div class="row">
                <canvas id="backgroundCanvas"></canvas>
            </div>

            <div class="row">
                <div class="column">
                    <img id="defaultImage" src="/static/logo.png" alt="Default Image">
                    <div class="img-magnifier-container">
                        <img id="uploadedImage" style="display:none;">
                    </div>
                </div>
            </div>


            <div>
                <button type="submit">Ok</button>
            </div>
        </div>

        <script src="/static/script.js"></script>
    </body>

</html>

{% endblock content %}
