<!-- login.html -->

{%  extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment Records</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: #f4f4f4;
    }

    .container {
        width: 80%;
        margin: 0 auto;
        padding: 20px;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ddd;
    }

    th {
        background-color: darkslategrey;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    .btn-details, .btn-export {
        padding: 8px 12px;
        margin-right: 5px;
        border: none;
        border-radius: 3px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-details:hover, .btn-export:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
<div class="container">
    <h2>Experiment Records</h2>
    <table>
        <thead>
            <tr>
                <th>Experiment ID</th>
                <th>Date</th>
                <th>Asphalt Percentage</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>2024-03-25</td>
                <td>75%</td>
                <td>
                    <button class="btn-details">Details</button>
                    <button class="btn-export">Export</button>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>2024-03-26</td>
                <td>80%</td>
                <td>
                    <button class="btn-details">Details</button>
                    <button class="btn-export">Export</button>
                </td>
            </tr>
            <tr>
                <td>3</td>
                <td>2024-03-27</td>
                <td>70%</td>
                <td>
                    <button class="btn-details">Details</button>
                    <button class="btn-export">Export</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>

{% endblock content %}
