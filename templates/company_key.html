<!DOCTYPE html>
{% extends "base.html" %}
{% block content %}


<html>

    <head>
        <title>{{ _('Company Key') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="icon" type="image/vnd.icon" href="{{ url_for('static', filename='favicon.ico') }}">
    </head>

    <body>
        <!-- First Row: Image Upload -->
        <div class="colorbar">
            <h2>{{ dynamic_content }}</h2>
        </div>
        <div class="container modern-container">
            <div class="row modern-row">
                <div class="column modern-column">
                    <p>{{ company_key }}</p>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='script_user.js') }}"></script>
    </body>

</html>

{% endblock content %}
