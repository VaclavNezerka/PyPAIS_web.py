# Daily backups of the AIBAL database to S3 (kept 30 days), via the barman-cloud plugin of CloudNativePG.
# Needs an S3 bucket with a read/write key pair (e.g. from CESNET's S3 storage):
#   1. kubectl create secret generic aibal-db-backup \
#        --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#   2. replace CHANGE-ME-BUCKET below and: kubectl apply -f deploy/k8s/postgres-backup.yaml
#   3. switch WAL archiving on in the database cluster:
#        kubectl patch cluster.postgresql.cnpg.io aibal-db --type merge -p \
#          '{"spec":{"plugins":[{"name":"barman-cloud.cloudnative-pg.io","isWALArchiver":true,"parameters":{"barmanObjectName":"aibal-db-backup"}}]}}'
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: aibal-db-backup
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://CHANGE-ME-BUCKET/aibal-db
    endpointURL: https://s3.a.cloud.e-infra.cz
    s3Credentials:
      accessKeyId:
        name: aibal-db-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: aibal-db-backup
        key: AWS_SECRET_ACCESS_KEY
  # needed for S3 services other than AWS
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_NO_CHUNKED_ENCODING
        value: "true"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: aibal-db-daily
spec:
  # seconds minutes hours day month weekday - every day at 02:00 UTC
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: aibal-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
